name: Daily refresh

# WDFW posts a new in-season report most Thursdays, but not always, and a run can
# fail. Checking daily means a report is picked up within a day of appearing instead
# of waiting for a weekly slot. The build is deterministic, so a day with no new
# report produces identical bytes and commits nothing.
on:
  schedule:
    - cron: '0 15 * * *'      # every day, 15:00 UTC (08:00 Pacific)
  workflow_dispatch:           # ...or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a tag like @v4 is mutable and can be
      # repointed at new code by whoever controls that repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      # a warm PDF cache means the weekly run does no redundant downloading
      - name: Restore the source-PDF cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/weekly_pdf
          key: wdfw-pdfs-${{ hashFiles('data/manifest.json') }}
          restore-keys: wdfw-pdfs-

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          # No fallback. An earlier version fell back to the unpinned
          # requirements.txt when this failed, which quietly turned off the
          # SHA-256 verification on the one job that runs unattended every day.
          # A failure here must stop the run, not downgrade its guarantees.
          pip install --require-hashes -r requirements.lock.txt

      - name: Fetch new reports, rebuild and validate
        run: python src/pipeline.py --no-open

      - name: Refuse to commit anything but data and the built page
        run: |
          # a refresh must never be able to change code; if it somehow did,
          # stop before pushing
          if ! git diff --quiet -- . ':(exclude)data' ':(exclude)docs'; then
            echo "::error::the refresh modified files outside data/ and docs/"
            git status --short
            exit 1
          fi

      - name: Commit the refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data docs; then
            echo "No new reports this week."
            exit 0
          fi
          git add data docs
          git commit -m "Data refresh: $(date -u +%Y-%m-%d)"
          git push
