name: Rebuild after a parser change

# Changing how a PDF is read makes every already-extracted row stale, which means
# re-reading ~700 reports. That takes half an hour, so it happens here rather than on
# anyone's laptop: push a parser change and the refreshed data comes back as a commit.
on:
  push:
    branches: [main]
    paths:
      - 'src/parse.py'
      - 'src/parse_annual.py'
      - 'src/build_data.py'
  workflow_dispatch:
    inputs:
      full:
        description: 'Ignore all caches and re-read every PDF'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # keep the downloaded PDFs between runs so a rebuild skips the download phase
      - name: Restore the source-PDF cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .cache/weekly_pdf
          key: wdfw-pdfs-${{ hashFiles('data/manifest.json') }}
          restore-keys: wdfw-pdfs-

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt

      - name: Re-read every report and rebuild
        run: python src/pipeline.py --no-open ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }}

      - name: Refuse to commit anything but data and the built page
        run: |
          if ! git diff --quiet -- . ':(exclude)data' ':(exclude)docs'; then
            echo "::error::the rebuild modified files outside data/ and docs/"
            git status --short
            exit 1
          fi

      - name: Commit the rebuilt data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data docs; then
            echo "Parser change produced identical output."
            exit 0
          fi
          git add data docs
          git commit -m "Rebuild after parser change: ${{ github.sha }}"
          git push
